[project]
name = "go2-api"
version = "0.1.0"
description = "The SSOT of the Go2 WebRTC connection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "unitree-webrtc-connect>=2.2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "websockets>=17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]

# ─── cobertura ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@(abc\\.)?abstractmethod", "\\.\\.\\.$"]

# ─── mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "unitree_webrtc_connect.*"
# A lib não publica tipos (py.typed); toda a superfície dela passa por
# `app/robot/unitree.py`, então o `Any` fica confinado a esse módulo.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return
    "PT",    # pytest-style
    "ASYNC", # async
    "S",     # bandit
    "RUF",   # ruff-specific
    "PL",    # pylint
    "TRY",   # tryceratops
    "TCH",   # type-checking imports
    "ANN",   # annotations
]
ignore = [
    "D203",
    "D213",   # conflitam com D211/D212
    "RUF001",
    "RUF002",
    "RUF003", # acentos e emojis são intencionais
    "TRY003", # mensagens longas inline são aceitáveis aqui
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "S101",
    "ANN",
    "PLR2004",
    "PLR0913",
    "SLF001",
    "PT011",
    "RUF012",
]

[tool.ruff.format]
docstring-code-format = true
